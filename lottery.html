<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 엘시드 송년회 뽑기 순서 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 눈송이 애니메이션 */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #d4af37;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1), 0 0 10px #d4af37;
            }
            50% {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1), 0 0 20px #d4af37, 0 0 30px #d4af37;
            }
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .button-container {
            margin: 30px 0;
        }

        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
            font-weight: bold;
            margin: 0 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .reset-btn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            background: white;
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.5s ease;
            font-size: 1.1em;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .rank {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            min-width: 60px;
        }

        .rank.first {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-size: 1.2em;
            animation: pulse 1s ease infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .name {
            flex: 1;
            text-align: center;
            font-weight: 500;
            color: #333;
        }

        .emoji {
            font-size: 1.5em;
        }

        .drawing-animation {
            font-size: 3em;
            animation: spin 0.5s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .status-message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            min-height: 30px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 엘시드 송년회 뽑기 순서 🎄</h1>
        <p class="subtitle">뽑기 순서를 랜덤으로 정해드려요!</p>
        
        <div class="button-container">
            <button id="startBtn" onclick="startLottery()">🎲 순서 정하기!</button>
            <button id="resetBtn" class="reset-btn" onclick="resetLottery()" style="display: none;">🔄 다시 정하기</button>
        </div>

        <div class="status-message" id="status"></div>

        <div class="results" id="results">
            <p style="color: #666; font-size: 1.1em;">버튼을 눌러 뽑기 순서를 정해보세요! 🎲</p>
        </div>
    </div>

    <script>
        // 참가자 명단
        const participants = [
            "정호석", "김성은", "이상화", "김도희", "박진우", 
            "허성혁", "양우혁", "이동현", "정윤기", "이주영", 
            "김성민", "조민근", "손가영", "김주희", "Thomas", 
            "박정은", "천정명"
        ];

        let isDrawing = false;
        let currentResults = [];

        // 눈송이 생성
        function createSnowflakes() {
            for (let i = 0; i < 20; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 2 + 's';
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                document.body.appendChild(snowflake);
            }
        }

        // 효과음 생성 (Web Audio API)
        function playSound(frequency, duration) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // 드럼롤 효과음
        function playDrumroll() {
            playSound(100, 0.1);
        }

        // 팡파레 효과음
        function playFanfare() {
            const notes = [523, 659, 784, 1047];
            notes.forEach((note, index) => {
                setTimeout(() => playSound(note, 0.3), index * 100);
            });
        }

        // 색종이 효과
        function createConfetti() {
            const colors = ['#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#ffd700'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.opacity = '1';
                    confetti.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                    document.body.appendChild(confetti);
                    
                    confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                        { transform: `translateY(${window.innerHeight + 10}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                    ], {
                        duration: 3000,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                    }).onfinish = () => confetti.remove();
                }, i * 30);
            }
        }

        // 추첨 시작
        async function startLottery() {
            if (isDrawing) return;
            
            isDrawing = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('results').innerHTML = '<div class="drawing-animation">🎲</div>';
            document.getElementById('status').textContent = '순서 정하는 중...';
            
            playDrumroll();

            // 배열 섞기 (Fisher-Yates shuffle)
            const shuffled = [...participants];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            currentResults = shuffled;

            // 한 명씩 공개
            for (let i = 0; i < shuffled.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                playSound(400 + (i * 50), 0.1);
                
                const resultsDiv = document.getElementById('results');
                if (i === 0) {
                    resultsDiv.innerHTML = '';
                }

                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                if (i === 0) {
                    resultItem.innerHTML = `
                        <span class="rank first">${i + 1}번째</span>
                        <span class="name">${shuffled[i]}</span>
                        <span class="emoji">🎯</span>
                    `;
                } else {
                    resultItem.innerHTML = `
                        <span class="rank">${i + 1}번째</span>
                        <span class="name">${shuffled[i]}</span>
                        <span class="emoji">🎲</span>
                    `;
                }
                
                resultsDiv.appendChild(resultItem);
                document.getElementById('status').textContent = `${i + 1}/${shuffled.length} 공개됨`;
            }

            // 완료
            playFanfare();
            createConfetti();
            document.getElementById('status').textContent = '🎉 순서 정하기 완료! 🎉';
            document.getElementById('resetBtn').style.display = 'inline-block';
            isDrawing = false;
        }

        // 다시 순서 정하기
        function resetLottery() {
            document.getElementById('results').innerHTML = '<p style="color: #666; font-size: 1.1em;">버튼을 눌러 뽑기 순서를 정해보세요! 🎲</p>';
            document.getElementById('status').textContent = '';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('resetBtn').style.display = 'none';
            currentResults = [];
        }

        // 페이지 로드 시 눈송이 생성
        window.onload = () => {
            createSnowflakes();
        };
    </script>
</body>
</html>
